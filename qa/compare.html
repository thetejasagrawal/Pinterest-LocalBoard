<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #ece7e2; font-family: -apple-system, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin-bottom: 8px; color: #3d3739; font-size: 13px; font-weight: 700; }
      img { display: block; width: 100%; max-height: 710px; object-fit: contain; object-position: top; background: white; border-radius: 8px; box-shadow: 0 12px 30px rgba(40, 25, 18, .14); }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Selected design reference</figcaption>
        <img src="screenshots/popup-v2-reference.png" alt="Selected reference" />
      </figure>
      <figure>
        <figcaption>Implemented Chrome popup</figcaption>
        <img src="screenshots/popup-v2-ready.png" alt="Implemented popup" />
      </figure>
    </main>
  </body>
</html>
