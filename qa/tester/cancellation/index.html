<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cancellation Regression Fixture</title>
  </head>
  <body>
    <h1>Cancellation Regression Fixture</h1>
    <article data-test-id="pin" data-test-pin-id="board-1">
      <a href="/pin/board-1/" aria-label="Fixture pin">
        <img src="https://i.pinimg.com/1200x/fixture/board-1.jpg" alt="Fixture pin" />
      </a>
    </article>
    <pre id="result">running</pre>

    <script>
      const mode = new URLSearchParams(location.search).get("mode") || "pack";
      const testDownloads = [];
      const runtimeMessages = [];
      const testStorage = {};
      let contentMessageListener = null;

      globalThis.chrome = {
        runtime: {
          onMessage: {
            addListener(listener) { contentMessageListener = listener; },
          },
          sendMessage(message) {
            runtimeMessages.push(message);
            if (mode === "verify" && message?.type === "VERIFY_BLOB_DOWNLOAD") {
              return new Promise(() => {});
            }
            return Promise.resolve({ ok: true });
          },
          getURL(path) { return `/extension/${path}`; },
        },
        storage: {
          local: {
            get(keys) {
              const requested = Array.isArray(keys) ? keys : [keys];
              return Promise.resolve(Object.fromEntries(
                requested
                  .filter((key) => Object.hasOwn(testStorage, key))
                  .map((key) => [key, testStorage[key]])
              ));
            },
            set(values) {
              Object.assign(testStorage, values);
              return Promise.resolve();
            },
            remove(keys) {
              for (const key of Array.isArray(keys) ? keys : [keys]) {
                delete testStorage[key];
              }
              return Promise.resolve();
            },
          },
        },
      };

      globalThis.fetch = async () => {
        const blob = new Blob(
          [new Uint8Array([255, 216, 255, 217])],
          { type: "image/jpeg" }
        );
        return new Response(blob, {
          status: 200,
          headers: { "Content-Type": "image/jpeg" },
        });
      };

      HTMLAnchorElement.prototype.click = function click() {
        testDownloads.push(this.download);
      };

      const initialProps = document.createElement("script");
      initialProps.id = "__PWS_INITIAL_PROPS__";
      initialProps.type = "application/json";
      initialProps.textContent = JSON.stringify({
        initialReduxState: {
          boards: {
            fixture: {
              id: "fixture-board",
              name: "Cancellation Fixture",
              url: "/qa/tester/cancellation/",
              pin_count: 1,
              section_count: 0,
              owner: { username: "fixture" },
            },
          },
          pins: {},
        },
      });
      document.head.appendChild(initialProps);

      function sendContentMessage(message) {
        return new Promise((resolve, reject) => {
          if (!contentMessageListener) {
            reject(new Error("content listener missing"));
            return;
          }
          contentMessageListener(message, {}, resolve);
        });
      }

      function finish(result) {
        document.body.dataset.testResult = result.passed ? "passed" : "failed";
        document.getElementById("result").textContent = JSON.stringify(result, null, 2);
      }
    </script>
    <script src="../../../extension/vendor/jszip.min.js"></script>
    <script>
      if (mode === "pack") {
        JSZip.prototype.generateAsync = function generateAsync(_options, onUpdate) {
          return new Promise((_resolve, reject) => {
            let percent = 0;
            const tick = () => {
              try {
                onUpdate({ percent });
                percent = Math.min(99, percent + 1);
                window.setTimeout(tick, 20);
              } catch (error) {
                reject(error);
              }
            };
            tick();
          });
        };
      }
    </script>
    <script src="../../../extension/content.js"></script>
    <script>
      (async () => {
        try {
          const start = await sendContentMessage({
            type: "START_DOWNLOAD",
            exportMode: "parts",
          });
          if (!start.ok) throw new Error("fixture could not start");

          const reachedStageBy = Date.now() + 5_000;
          let status = await sendContentMessage({ type: "GET_STATUS" });
          while (Date.now() < reachedStageBy) {
            const reachedPack = mode === "pack" && status.stage === "zipping";
            const reachedVerify = mode === "verify" && runtimeMessages.some(
              (message) => message?.type === "VERIFY_BLOB_DOWNLOAD"
            );
            if (reachedPack || reachedVerify) break;
            await new Promise((resolve) => setTimeout(resolve, 20));
            status = await sendContentMessage({ type: "GET_STATUS" });
          }

          const secondStart = await sendContentMessage({
            type: "START_DOWNLOAD",
            exportMode: "single",
          });
          const cancelledAt = Date.now();
          await sendContentMessage({ type: "CANCEL_DOWNLOAD" });

          const cancelledBy = Date.now() + 2_000;
          while (status.stage !== "cancelled" && Date.now() < cancelledBy) {
            await new Promise((resolve) => setTimeout(resolve, 20));
            status = await sendContentMessage({ type: "GET_STATUS" });
          }

          const cancelLatencyMs = Date.now() - cancelledAt;
          const verificationMessages = runtimeMessages.filter(
            (message) => message?.type === "VERIFY_BLOB_DOWNLOAD"
          );
          const verificationCancellationMessages = runtimeMessages.filter(
            (message) => message?.type === "CANCEL_BLOB_DOWNLOAD_VERIFICATION"
          );
          finish({
            passed:
              status.stage === "cancelled" &&
              cancelLatencyMs < 1_000 &&
              secondStart.ok === false &&
              secondStart.reason.includes("already running") &&
              !Object.hasOwn(testStorage, "localBoardResumeCheckpoint") &&
              (mode === "pack"
                ? testDownloads.length === 0 &&
                  verificationMessages.length === 0 &&
                  verificationCancellationMessages.length === 0
                : testDownloads.length === 1 &&
                  verificationMessages.length === 1 &&
                  verificationCancellationMessages.length === 1 &&
                  verificationCancellationMessages[0].verificationId ===
                    verificationMessages[0].verificationId),
            mode,
            status,
            secondStart,
            cancelLatencyMs,
            downloads: testDownloads,
            verificationMessages,
            verificationCancellationMessages,
            storage: testStorage,
          });
        } catch (error) {
          finish({ passed: false, mode, error: error.message });
        }
      })();
    </script>
  </body>
</html>
