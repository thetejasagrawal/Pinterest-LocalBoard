<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinterest LocalBoard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">

      <header class="top-bar">
        <span class="brand">
          <svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="8" cy="8" r="2.6" fill="currentColor"/>
          </svg>
          <span class="brand-name">LocalBoard</span>
        </span>
        <span id="statusPill" class="pill">
          <span class="pill-dot"></span>
          <span id="statusPillText" class="pill-text">Idle</span>
        </span>
      </header>

      <section class="board-section">
        <h1 id="boardName" class="board-name">Waiting for a board…</h1>
        <p id="boardMeta" class="board-meta"></p>
        <p id="boardUrl" class="board-url"></p>
        <p id="boardWarning" class="board-warning hidden"></p>
      </section>

      <div class="divider"></div>

      <section id="progressSection" class="progress-section hidden">
        <div class="progress-bar-shell">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-row">
          <span id="statusMsg" class="status-msg">Ready.</span>
          <span id="progressPct" class="progress-pct">0%</span>
        </div>
        <div class="stats-row">
          <span id="statExpected" class="stat">— expected</span>
          <span class="stat-dot">·</span>
          <span id="statCollected" class="stat">0 collected</span>
          <span class="stat-dot">·</span>
          <span id="statDownloaded" class="stat">0 saved</span>
        </div>
        <p id="warningLine" class="inline-warning hidden"></p>
      </section>

      <section id="selectionSection" class="selection-section hidden">
        <div class="selection-badge">
          <svg class="sel-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.12"/>
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5 8.2l2.2 2.2 3.8-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span id="selectionCount" class="sel-count">0 pins selected</span>
        </div>
        <p class="sel-hint">Click pins on the board page to pick them.</p>
      </section>

      <footer class="actions">
        <div id="idleActions" class="action-pair">
          <button id="selectButton" class="btn btn-secondary" type="button">
            <svg viewBox="0 0 16 16" class="btn-icon" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M5.4 8.3l1.9 1.9 3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>Select</span>
          </button>
          <button id="startButton" class="btn btn-primary" type="button" disabled>
            <svg viewBox="0 0 16 16" class="btn-icon" aria-hidden="true">
              <path d="M8 2.5v7.6m0 0l2.6-2.6M8 10.1L5.4 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M3.2 12.5v.4a1 1 0 001 1h7.6a1 1 0 001-1v-.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            </svg>
            <span>Download All</span>
          </button>
        </div>
        <div id="selectionActions" class="action-pair hidden">
          <button id="exitSelectionButton" class="btn btn-secondary" type="button">
            <span>Exit</span>
          </button>
          <button id="downloadSelectedButton" class="btn btn-primary" type="button" disabled>
            <svg viewBox="0 0 16 16" class="btn-icon" aria-hidden="true">
              <path d="M8 2.5v7.6m0 0l2.6-2.6M8 10.1L5.4 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M3.2 12.5v.4a1 1 0 001 1h7.6a1 1 0 001-1v-.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            </svg>
            <span>Download</span>
          </button>
        </div>
        <button id="cancelButton" class="btn btn-cancel hidden" type="button">Cancel</button>
      </footer>

      <div class="divider"></div>

      <section class="history-section">
        <div class="history-header">
          <span class="section-label">Recent</span>
          <button id="clearHistoryButton" class="text-btn" type="button">Clear</button>
        </div>
        <div id="historyList" class="history-list">
          <p class="empty-text">No downloads yet.</p>
        </div>
      </section>

      <div class="tool-row">
        <button id="refreshButton" class="text-btn" type="button">Refresh</button>
        <span class="dot-sep">·</span>
        <button id="reloadTabButton" class="text-btn" type="button">Reload Tab</button>
        <span class="dot-sep">·</span>
        <button id="openBoardButton" class="text-btn" type="button">Open Board</button>
      </div>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
