<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinterest LocalBoard Promo Tile</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="promoTile">
      <div class="tileGlow"></div>
      <div class="tileHeader">
        <img src="../../logo.png" alt="Pinterest LocalBoard logo" />
        <div>
          <strong>Pinterest LocalBoard</strong>
          <span>Chrome extension</span>
        </div>
      </div>

      <h1>One board.<br />One ZIP.</h1>
      <div class="tileShot">
        <div class="tileGrid">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="tilePopup"></div>
      </div>
    </main>
  </body>
</html>
